spring.application.name=authservice

# =====================================================
# SERVER
# =====================================================

server.port=8080


# =====================================================
# POSTGRESQL
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/authservice
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# =====================================================
# EMAIL
# =====================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================================================
# APPLICATION URL
# =====================================================

app.verification-url=${VERIFICATION_URL:http://localhost:8080/api/auth/verify}


# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN}


# =====================================================
# VERIFICATION
# =====================================================

app.verification-token-expiration-hours=24


# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.security=INFO

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=true
management.info.env.enabled=true