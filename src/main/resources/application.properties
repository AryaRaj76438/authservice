spring.application.name=authservice

# =====================================================
# SERVER
# =====================================================

server.port=8080


# =====================================================
# POSTGRESQL
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/authservice
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# =====================================================
# EMAIL
# =====================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================================================
# APPLICATION URL
# =====================================================

app.verification-url=${VERIFICATION_URL:http://localhost:8080/api/auth/verify}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN}


# =====================================================
# EMAIL VERIFICATION
# =====================================================

app.verification-token-expiration-hours=24
app.verification-resend-cooldown-seconds=60
app.refresh-token.expiration-days=7
# =====================================================
# LOGIN SECURITY
# =====================================================

app.login.max-failed-attempts=5
app.login.lock-duration-minutes=15
app.login.attempt-window-minutes=15

# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.security=INFO

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=true
management.info.env.enabled=true

# =====================================================
# REDIS
# =====================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# =====================================================
# PASSWORD RESET
# =====================================================

app.password-reset.token-expiration-minutes=30
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:3000}


app.email-outbox.poll-interval-ms = 5000

# =====================================================
# AUTH COOKIE
# =====================================================

app.auth.refresh-cookie-name=refresh_token

app.auth.refresh-cookie-path=/api/auth

app.auth.refresh-cookie-secure=${COOKIE_SECURE:false}

app.auth.refresh-cookie-http-only=true

app.auth.refresh-cookie-same-site=${COOKIE_SAME_SITE:Lax}

app.auth.refresh-cookie-max-age-days=7